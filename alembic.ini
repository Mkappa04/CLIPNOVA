# Alembic CLI config. The database URL is taken from CLIPNOVA settings (.env).
# Usage: .venv/bin/alembic upgrade head   |   .venv/bin/alembic revision --autogenerate -m "msg"
[alembic]
script_location = backend/database/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
